[config]
schemaVersion = "0.0.1"

[package]
namespace = "CHANGE_ME"
name = "TimeConfig"
versionNumber = "0.1.0"
description = "Host-authoritative day length and quota pacing configuration for Gamble With Your Friends."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./src/TimeConfig/Packaging/icon.png"
readme = "./src/TimeConfig/Packaging/README.md"
outdir = "./artifacts/thunderstore/tcli-build"

[[build.copy]]
source = "./src/TimeConfig/bin/Release/netstandard2.1/TimeConfig.dll"
target = "plugins/TimeConfig/"

[publish]
repository = "https://thunderstore.io"
communities = ["gamble-with-your-friends"]

[publish.categories]
gamble-with-your-friends = ["mods"]
