[config]
schemaVersion = "0.0.1"

[package]
namespace = "CHANGE_ME"
name = "ConfigManager"
versionNumber = "0.2.2"
description = "Lets the lobby host change day length, starting quota, catch-up factor, and quota scaling from the lobby Settings tab."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./src/ConfigManager/Packaging/icon.png"
readme = "./src/ConfigManager/Packaging/README.md"
outdir = "./artifacts/thunderstore/tcli-build"

[[build.copy]]
source = "./src/ConfigManager/bin/Release/netstandard2.1/ConfigManager.dll"
target = "plugins/ConfigManager/"

[publish]
repository = "https://thunderstore.io"
communities = ["gamble-with-your-friends"]

[publish.categories]
gamble-with-your-friends = ["mods"]
