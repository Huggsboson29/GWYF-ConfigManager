name: Export TCLI Token

on:
  workflow_dispatch:

jobs:
  export:
    runs-on:
      - self-hosted
      - Windows
    steps:
      - name: Write token to local runner file
        shell: pwsh
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          $path = 'C:\actions-runner\gwyf-configmanager\_work\secret-export.txt'
          Set-Content -LiteralPath $path -Value $env:TCLI_AUTH_TOKEN -NoNewline